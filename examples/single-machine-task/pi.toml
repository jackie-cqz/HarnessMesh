[agent]
name = "pi-local"
harness = "pi"
mode = "managed"
project_id = "pi-project"

[project]
root = "C:/absolute/project-pi"
allowed_tools = ["read", "write", "edit"]
artifact_paths = ["out/health.json"]
require_remote_task_approval = true

[adapter]
executable = "C:/absolute/npm/pi.cmd"
provider = "deepseek"
model = "deepseek-v4-pro"
env_allowlist = ["DEEPSEEK_API_KEY"]
