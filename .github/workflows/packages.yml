name: Native runtime
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Restore native build cache
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: native-${{ runner.os }}-${{ runner.arch }}-rust190-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-rust190-${{ hashFiles('Cargo.lock') }}-
            native-${{ runner.os }}-${{ runner.arch }}-rust190-
      - name: Build native release runtime
        run: cargo build --release --locked -p hmesh-cli -p hmesh-mcp
      - name: Save native build cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Package allowlisted binaries and launchers
        run: node scripts/package-runtime.mjs --out target/bundles
      - name: Unpack and run with no Rust or Node on the child PATH
        run: node scripts/package-smoke.mjs --archive-dir target/bundles
      - name: Native backup and disposable login registration lifecycle
        run: node scripts/maintenance-smoke.mjs --binary target/release/hmesh${{ runner.os == 'Windows' && '.exe' || '' }} --startup-install
      - name: Upload native runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harnessmesh-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/bundles/*.tar.gz
            target/bundles/*.zip
          if-no-files-found: error
          retention-days: 14
