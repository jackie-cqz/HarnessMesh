name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-28
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - name: Tailnet startup configuration tests
        run: node --test scripts/tailnet-config.test.mjs scripts/acceptance/protocol.test.mjs
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests without model credentials
        run: cargo test --locked --workspace
      - name: Build model-free acceptance binaries
        run: cargo build --locked -p hmesh-cli -p hmesh-fixture
      - name: Offline backup, restore and startup planning without models
        run: node scripts/maintenance-smoke.mjs
      - name: Two-node automated acceptance without models
        run: node scripts/acceptance/local-smoke.mjs
      - name: Bounded repair orchestration with explicit test double
        run: node scripts/acceptance/local-smoke.mjs --fixture-repair
      - name: Guardian crash uncertainty without models
        run: node scripts/reliability/local-smoke.mjs
      - name: Install pinned browser regression tools
        if: runner.os == 'Linux'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install headless Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Panel create, recover and artifact verification without models
        if: runner.os == 'Linux'
        run: npm run test:panel
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Audit every Cargo.lock target against OSV
        run: cargo run --locked -p xtask -- audit
